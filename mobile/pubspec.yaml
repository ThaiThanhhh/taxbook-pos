name: dt13_pos
description: "ĐT13 POS - bán hàng và sổ thuế cho hộ kinh doanh (offline-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  intl: ^0.20.3
  riverpod_annotation: ^4.0.7
  # F01 – lưu trữ offline. drift 2.35.x kéo sqlite3 3.x, bản này tự đóng gói
  # SQLite native qua build hooks. sqlite3_flutter_libs 0.6.0+eol là bản
  # "rỗng": giữ theo yêu cầu F01 để chặn ai đó kéo nhầm 0.5.x (build script
  # cũ, xung đột với sqlite3 3.x).
  drift: ^2.35.3
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2.17+ đòi build ^5, riverpod_generator 4.x chưa hỗ trợ -> giữ 2.16.x.
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9
  # Cùng nhánh với drift 2.35; chạy được với build_runner 2.16.2 (không đòi 2.17).
  drift_dev: ^2.35.2

flutter:
  uses-material-design: true
  assets:
    - assets/seed/com_tam.json
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
