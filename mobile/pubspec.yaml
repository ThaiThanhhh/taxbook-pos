name: dt13_pos
description: "ĐT13 POS - bán hàng và sổ thuế cho hộ kinh doanh (offline-first)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.2
  riverpod_annotation: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 2.17+ đòi build ^5, riverpod_generator 4.x chưa hỗ trợ -> giữ 2.16.x.
  build_runner: ^2.16.2
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.9

flutter:
  uses-material-design: true
