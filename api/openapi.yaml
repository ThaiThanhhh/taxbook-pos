openapi: 3.0.3
info:
  title: DT13 - API "Ban la co so" cho ho kinh doanh
  version: 0.1.0
  description: |
    Hop dong API cho ung dung ban hang offline-first, hoa don dien tu (sandbox),
    so sach, tinh thue theo tham so va tro ly AI co dan nguon.

    Quy uoc chung:
    - Duong dan goc /api/v1, JSON snake_case.
    - Tien la so nguyen VND. Thoi gian ISO 8601 UTC.
    - Xac thuc Bearer JWT. Cac POST khong phai dong bo gui header Idempotency-Key.
    - Moi loi tra ve khung ErrorEnvelope.
    - Cac con so thue trong vi du chi de minh hoa dinh dang, khong phai ket qua tinh thue that.
servers:
  - url: http://localhost:3000/api/v1
    description: May phat trien
  - url: https://staging.example.com/api/v1
    description: Staging (thay bang dia chi that)
tags:
  - name: Auth
  - name: Products
  - name: Sync
  - name: Sales
  - name: Invoices
  - name: Ledger
  - name: BankStatements
  - name: Tax
  - name: Reports
  - name: AI
  - name: Admin
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Dang nhap bang so dien thoai va PIN
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Dang nhap thanh cong
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Lam moi token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Token moi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /products:
    get:
      tags: [Products]
      summary: Danh sach san pham (ho tro tai ve may theo moc cap nhat)
      operationId: listProducts
      parameters:
        - name: updated_since
          in: query
          description: Chi lay san pham thay doi sau thoi diem nay
          schema:
            type: string
            format: date-time
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trang san pham
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductPage'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [Products]
      summary: Tao san pham
      operationId: createProduct
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'
      responses:
        '201':
          description: Da tao
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /products/{product_id}:
    put:
      tags: [Products]
      summary: Sua san pham (can version hien tai de tranh ghi de)
      operationId: updateProduct
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        '200':
          description: Da cap nhat, version tang len
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /products/by-barcode/{code}:
    get:
      tags: [Products]
      summary: Tra san pham theo ma vach
      operationId: getProductByBarcode
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: San pham
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '404':
          $ref: '#/components/responses/NotFound'
  /sync/sales:
    post:
      tags: [Sync]
      summary: Day lo don ban tu thiet bi len server
      description: |
        Server xu ly tuan tu theo (device_id, local_seq). Gui lai cung client_op_id
        khong tao don moi, tra duplicate=true. Mot don loi khong chan cac don sau.
      operationId: syncSales
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncSalesRequest'
            example:
              device_id: dev-7f3a
              sales:
                - client_op_id: b3c1d2e4-5f60-4a7b-9c8d-0e1f2a3b4c5d
                  local_seq: 101
                  client_created_at: '2026-11-02T05:12:44Z'
                  tmp_number: TMP-7F3A-000101
                  items:
                    - product_id: p-001
                      qty: 2
                      unit_price_vnd: 45000
                  discount_vnd: 0
                  payments:
                    - method: CASH
                      amount_vnd: 90000
      responses:
        '200':
          description: Ket qua tung don
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSalesResponse'
              example:
                results:
                  - client_op_id: b3c1d2e4-5f60-4a7b-9c8d-0e1f2a3b4c5d
                    status: INVOICED
                    duplicate: false
                    sale_id: s-9001
                    invoice:
                      series: HKD26
                      number: '0000123'
                server_time: '2026-11-02T07:30:00Z'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /sync/changes:
    get:
      tags: [Sync]
      summary: Keo thay doi (danh muc, tham so thue) ve may
      operationId: pullChanges
      parameters:
        - name: since
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        '200':
          description: Cac thay doi tu moc since
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /sales/{sale_id}:
    get:
      tags: [Sales]
      summary: Xem don ban
      operationId: getSale
      parameters:
        - $ref: '#/components/parameters/SaleId'
      responses:
        '200':
          description: Don ban
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
  /sales/{sale_id}/cancel:
    post:
      tags: [Sales]
      summary: Huy don bang giao dich huy (khong xoa don goc)
      operationId: cancelSale
      parameters:
        - $ref: '#/components/parameters/SaleId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Don da huy, co giao dich huy va but toan dieu chinh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PeriodLocked'
  /invoices:
    get:
      tags: [Invoices]
      summary: Danh sach hoa don, loc theo trang thai
      operationId: listInvoices
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/InvoiceStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trang hoa don
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePage'
  /invoices/{invoice_id}:
    get:
      tags: [Invoices]
      summary: Xem hoa don
      operationId: getInvoice
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Hoa don
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
  /invoices/{invoice_id}/retry:
    post:
      tags: [Invoices]
      summary: Gui lai hoa don loi
      operationId: retryInvoice
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: Da dua lai vao hang doi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ProviderUnavailable'
  /ledger:
    get:
      tags: [Ledger]
      summary: Xem so theo mau so va khoang ngay
      operationId: listLedger
      parameters:
        - name: book
          in: query
          description: Ma mau so (vi du S1A, S2A). Danh sach mau day du can chot theo Thong tu 152/2025.
          schema:
            type: string
        - name: from
          in: query
          schema:
            type: string
            format: date
        - name: to
          in: query
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trang but toan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerPage'
        '403':
          $ref: '#/components/responses/Forbidden'
  /expenses:
    post:
      tags: [Ledger]
      summary: Nhap chi phi (tay hoac tu ban nhap OCR)
      operationId: createExpense
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseInput'
      responses:
        '201':
          description: Da tao chi phi (chua vao so neu la ban nhap OCR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /expenses/{expense_id}/confirm:
    post:
      tags: [Ledger]
      summary: Xac nhan chi phi de ghi so
      operationId: confirmExpense
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Da ghi so
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Expense'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PeriodLocked'
  /bank-statements/import:
    post:
      tags: [BankStatements]
      summary: Nhap file sao ke gia lap (CSV)
      operationId: importBankStatement
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Ket qua nhap
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankImportResult'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /bank-statements/matches:
    get:
      tags: [BankStatements]
      summary: Goi y khop sao ke voi so
      operationId: listBankMatches
      parameters:
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/BankLineStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Trang dong sao ke
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLinePage'
  /bank-statements/{line_id}/match:
    post:
      tags: [BankStatements]
      summary: Chot hoac bo khop mot dong sao ke
      operationId: matchBankLine
      parameters:
        - name: line_id
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BankMatchRequest'
      responses:
        '200':
          description: Dong sao ke sau khi cap nhat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BankLine'
        '404':
          $ref: '#/components/responses/NotFound'
  /tax/params:
    get:
      tags: [Tax]
      summary: Lay bo tham so thue hien hanh (hoac theo ngay)
      operationId: getTaxParams
      parameters:
        - name: as_of
          in: query
          description: Ngay can lay tham so; mac dinh la hom nay
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Bo tham so co hieu luc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxParamSet'
        '404':
          $ref: '#/components/responses/NotFound'
  /tax/periods:
    get:
      tags: [Tax]
      summary: Danh sach ky thue
      operationId: listTaxPeriods
      responses:
        '200':
          description: Cac ky thue cua ho
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaxPeriod'
        '403':
          $ref: '#/components/responses/Forbidden'
  /tax/periods/{period_id}/calculate:
    post:
      tags: [Tax]
      summary: Tinh thue cho ky (tinh lai duoc khi con DRAFT)
      operationId: calculateTaxPeriod
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                pit_method:
                  $ref: '#/components/schemas/PitMethod'
      responses:
        '200':
          description: Ky thue sau khi tinh
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxPeriod'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PeriodLocked'
  /tax/periods/{period_id}/confirm:
    post:
      tags: [Tax]
      summary: Chot ky thue (khong sua so lieu sau khi chot)
      operationId: confirmTaxPeriod
      parameters:
        - $ref: '#/components/parameters/PeriodId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Ky da chot
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxPeriod'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/PeriodLocked'
  /tax/periods/{period_id}/return-draft:
    get:
      tags: [Tax]
      summary: Tai to khai mau dang nhap
      operationId: getReturnDraft
      parameters:
        - $ref: '#/components/parameters/PeriodId'
      responses:
        '200':
          description: File to khai mau
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
  /reports/daily-profit:
    get:
      tags: [Reports]
      summary: Lai trong ngay
      operationId: getDailyProfit
      parameters:
        - name: date
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Doanh thu, chi phi, lai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyProfit'
  /reports/top-products:
    get:
      tags: [Reports]
      summary: Mat hang ban chay
      operationId: getTopProducts
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        '200':
          description: Danh sach mat hang
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/TopProduct'
  /reports/cashflow:
    get:
      tags: [Reports]
      summary: Dong tien theo ngay
      operationId: getCashflow
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Thu chi theo ngay
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CashflowDay'
  /reminders:
    get:
      tags: [Reports]
      summary: Nhac han ke khai va nop thue
      operationId: listReminders
      responses:
        '200':
          description: Cac nhac han sap toi
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Reminder'
  /ai/ask:
    post:
      tags: [AI]
      summary: Hoi dap ve so va thue, co dan nguon
      description: AI chi doc ket qua tu so va engine thue; khong ghi so; tu choi khi thieu du lieu.
      operationId: aiAsk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskRequest'
      responses:
        '200':
          description: Cau tra loi kem nguon hoac tu choi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
              example:
                answer: Thue tam tinh thang 10 la 1.250.000 dong.
                sources:
                  - type: tax_period
                    id: tp-2026-10
                    fields: [vat_vnd, pit_vnd]
                refused: false
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /ai/expense-ocr:
    post:
      tags: [AI]
      summary: Doc anh hoa don mua vao ra ban nhap chi phi
      operationId: aiExpenseOcr
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image:
                  type: string
                  format: binary
      responses:
        '200':
          description: Ban nhap chi phi (chua vao so)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseOcrResult'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /admin/tax-param-sets:
    put:
      tags: [Admin]
      summary: Them bo tham so thue moi (chi ADMIN)
      operationId: putTaxParamSet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxParamSetInput'
      responses:
        '201':
          description: Da tao bo tham so
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxParamSet'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationFailed'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID do client sinh; gui lai cung khoa thi tra ket qua cu
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    ProductId:
      name: product_id
      in: path
      required: true
      schema:
        type: string
    SaleId:
      name: sale_id
      in: path
      required: true
      schema:
        type: string
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema:
        type: string
    ExpenseId:
      name: expense_id
      in: path
      required: true
      schema:
        type: string
    PeriodId:
      name: period_id
      in: path
      required: true
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Thieu hoac het han token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: UNAUTHENTICATED
              message: Token het han
              details: []
              trace_id: tr-0001
    Forbidden:
      description: Sai vai tro hoac truy cap du lieu ho khac
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Khong co doi tuong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Sai version (du lieu da doi)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    PeriodLocked:
      description: Ky thue da chot, khong sua so lieu
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: PERIOD_LOCKED
              message: Ky thue 2026-Q4 da chot
              details: []
              trace_id: tr-0002
    ValidationFailed:
      description: Du lieu sai; details chi ro tung truong
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error:
              code: VALIDATION_FAILED
              message: Du lieu khong hop le
              details:
                - field: items[0].qty
                  reason: phai lon hon 0
              trace_id: tr-0003
    ProviderUnavailable:
      description: Hoa don sandbox khong phan hoi; don van giu trong hang doi
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, trace_id]
          properties:
            code:
              type: string
              enum:
                - UNAUTHENTICATED
                - FORBIDDEN
                - NOT_FOUND
                - CONFLICT
                - PERIOD_LOCKED
                - VALIDATION_FAILED
                - PROVIDER_UNAVAILABLE
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  reason:
                    type: string
